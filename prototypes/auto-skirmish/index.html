<title>Augury Skirmish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: a tactics table — team A rail | hex board with the pulse log | team B rail; stacks to one column on phones. One dark arena look, chosen on purpose. */
:root {
  --bg: #121722; --panel: #19202e; --panel2: #202a3b; --line: #2c3850; --hex: #1d2636; --hex-edge: #34425e;
  --fg: #e7ecf6; --dim: #8e9ab4; --a: #5ab4ff; --a-deep: #1d3d5c; --b: #ff7a59; --b-deep: #5a2a22;
  --gold: #e7b75a; --good: #7bd88f; --bad: #ff6b6b; --frost: #9fd8ff; --fire: #ff9b54; --poison: #8fdc6e; --arcane: #c49bff;
  --display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
[hidden] { display: none !important; }
body { font-family: var(--body); font-size: 14px; line-height: 1.4; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:hover:not([disabled]) { border-color: var(--dim); }
button:focus-visible, .tok:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button[disabled] { opacity: .45; cursor: default; }
button.primary { background: var(--gold); color: #1b1407; border-color: var(--gold); font-weight: 600; }
button.on { border-color: var(--gold); color: var(--gold); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; }
.brand small { color: var(--dim); font-weight: 500; letter-spacing: .08em; font-size: 12px; margin-left: 6px; }
.meter { display: flex; flex-direction: column; gap: 1px; }
.meter span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.meter b { font-family: var(--display); font-size: 20px; font-weight: 700; }
.meter b.A { color: var(--a); } .meter b.B { color: var(--b); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }

.table { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr) minmax(0, 300px); gap: 14px; align-items: start; }
@media (max-width: 1100px) { .table { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .centre { grid-column: 1 / -1; order: -1; } }
@media (max-width: 680px) { .table { grid-template-columns: minmax(0, 1fr); } }
.rail { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rail h2 { font-family: var(--display); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin: 0; display: flex; justify-content: space-between; }
.rail h2.A { color: var(--a); } .rail h2.B { color: var(--b); }
.centre { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; cursor: default; }
.card.A { box-shadow: inset 3px 0 0 var(--a); } .card.B { box-shadow: inset 3px 0 0 var(--b); }
.card.sel { border-color: var(--gold); }
.card.dead { opacity: .5; }
.card.can { cursor: pointer; }
.card .hd { display: flex; align-items: baseline; gap: 8px; }
.card .hd b { font-family: var(--display); font-size: 15px; }
.card .hd .role { color: var(--dim); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.card .hd .lv { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--gold); }
/* Compact cards (D-077): the five champions of a team fit the screen; details are in the hover card */
.rail { gap: 6px; }
.rail .card { padding: 6px 8px; gap: 4px; }
.rail .card .hd { align-items: center; gap: 8px; }
.rail .card .pt { width: 40px; height: 40px; }
.card .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.card .row1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.card .row1 b { font-family: var(--display); font-size: 15px; }
.card .row1 .role { color: var(--dim); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
.card .row1 .lv { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--gold); white-space: nowrap; }
.icons { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 13.5px; line-height: 1.35; }
.ic { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; cursor: help; }
.ic b { font-family: var(--mono); font-weight: 500; font-size: 12.5px; color: var(--fg); }
.ic.up b { color: var(--gold); }
.ic.sp { color: var(--gold); } .ic.sp .pips { font-size: 10px; letter-spacing: 1px; }
.ic.st { background: #0e131c; border: 1px solid var(--line); border-radius: 9px; padding: 0 5px; font-size: 12px; }
.buffs { display: flex; flex-wrap: wrap; gap: 4px; }
.tip { position: fixed; z-index: 30; width: min(340px, calc(100vw - 16px)); background: #111722f2; border: 1px solid var(--dim); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; box-shadow: 0 8px 28px #000a; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
.tip .tiphd { display: flex; gap: 10px; align-items: center; }
.tip .tiphd img { width: 54px; height: 54px; object-fit: contain; }
.tip .tiphd div { display: flex; flex-direction: column; gap: 1px; }
.tip .tiphd b { font-family: var(--display); font-size: 16px; }
.tip .tiphd span { color: var(--dim); font-size: 11.5px; }
.tip ul, .tip ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
.tip ul { list-style: none; padding-left: 0; }
.tip p { margin: 0; }
.tip .path { color: var(--dim); font-size: 11.5px; }
.tip .path .pick { color: var(--gold); } .tip .path .not { text-decoration: line-through; opacity: .6; }
.hp { position: relative; height: 12px; background: #0e131c; border-radius: 3px; overflow: hidden; }
.hp i { position: absolute; inset: 0 auto 0 0; background: var(--good); }
.hp .sh { position: absolute; top: 0; bottom: 0; background: var(--frost); opacity: .7; }
.hp em { position: absolute; right: 4px; top: -1px; font-size: 10px; font-style: normal; font-family: var(--mono); color: var(--fg); font-weight: 600; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--dim); }
.stats b { color: var(--fg); font-family: var(--mono); font-weight: 500; }
.stats b.up { color: var(--gold); }
.chip { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 9px; border: 1px solid var(--line); color: var(--dim); letter-spacing: .02em; }
.chip.rule { color: var(--fg); border-color: var(--dim); }
.chip.syn { color: var(--gold); border-color: #6b5426; }
.chip.st { color: var(--frost); border-color: #36506a; }
.chip.ps { color: var(--poison); border-color: #3b5a2c; }
.procs { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr) 34px; gap: 2px 6px; align-items: center; font-size: 11.5px; }
.procs .bar { height: 6px; background: #0e131c; border-radius: 3px; overflow: hidden; }
.procs .bar i { display: block; height: 100%; }
.procs .pct { font-family: var(--mono); text-align: right; font-size: 11px; }
.procs .pct.up { color: var(--gold); }
.next { font-size: 11px; color: var(--dim); }
.next b { color: var(--fg); font-weight: 600; }
details.tree summary { font-size: 11px; color: var(--dim); cursor: pointer; }
details.tree ol { margin: 4px 0 0; padding-left: 18px; font-size: 11px; color: var(--dim); }
details.tree li .pick { color: var(--gold); }
details.tree li .not { text-decoration: line-through; opacity: .6; }
.cards2 { display: flex; gap: 6px; }
.cards2 button { flex: 1 1 0; text-align: left; font-size: 12px; padding: 5px 7px; min-width: 0; }
.cards2 button small { display: block; color: var(--dim); font-family: var(--mono); font-size: 12px; }
.cards2 button.used { border-color: var(--gold); }

.boardwrap { background: radial-gradient(ellipse at center, #1a2232 0%, var(--bg) 75%); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
svg#board { display: block; width: 100%; height: auto; max-height: 64vh; touch-action: manipulation; }
.hexp { fill: var(--hex); stroke: var(--hex-edge); stroke-width: 1; }
.hexp.hill { fill: #2a2a22; }
.hexp.tower { fill: #2b3346; stroke: #56647f; }
.hexp.nexA { fill: var(--a-deep); } .hexp.nexB { fill: var(--b-deep); }
.hexp.reach { fill: #22402e; stroke: var(--good); cursor: pointer; }
.hexp.reach:hover, .hexp.hover { fill: #2e5a3c; }
.lbl { font-size: 9px; fill: var(--dim); text-anchor: middle; dominant-baseline: middle; pointer-events: none; font-family: var(--body); }
.lbl.big { font-size: 13px; fill: #c4cde0; }
.lbl.nx { font-size: 8px; fill: #ffffffb0; letter-spacing: .1em; }
.link { stroke: var(--gold); stroke-width: 3; stroke-linecap: round; opacity: .75; pointer-events: none; }
.link.new { stroke: var(--good); opacity: 1; stroke-width: 4; }
.link.lost { stroke: var(--bad); stroke-dasharray: 5 4; opacity: 1; }
.aim { stroke-width: 1.5; fill: none; opacity: .55; pointer-events: none; }
.aim.A { stroke: var(--a); } .aim.B { stroke: var(--b); }
.aim.hot { opacity: 1; stroke-width: 2.5; }
.strike { stroke: #fff; stroke-width: 3; opacity: .9; pointer-events: none; }
.tok circle.body { stroke-width: 3; }
.tok.A circle.body { fill: #173049; stroke: var(--a); } .tok.B circle.body { fill: #45211b; stroke: var(--b); }
.tok.mine { cursor: pointer; }
.tok.sel circle.body { stroke: var(--gold); stroke-width: 4; }
.tok.actor circle.body { stroke: #fff; stroke-width: 4; }
.tok text.g { font-family: var(--display); font-weight: 700; font-size: 17px; text-anchor: middle; dominant-baseline: central; fill: var(--fg); pointer-events: none; }
.tok .ini { font-family: var(--mono); font-size: 10px; text-anchor: middle; dominant-baseline: central; fill: #0d1119; font-weight: 600; pointer-events: none; }
.tok .inibg { fill: var(--dim); } .tok .inibg.up { fill: var(--gold); } .tok .inibg.down { fill: var(--bad); }
.tok .st { font-size: 11px; text-anchor: middle; pointer-events: none; }
/* Art view (D-075): sprites, isometric squash, code-driven motion */
svg#board.art { max-height: 70vh; }
.boardwrap:has(svg.art) { background: radial-gradient(ellipse at center, #2b3a2a 0%, #141b14 80%); }
.art .hexp { fill: url(#grass); stroke: #2f4a22; stroke-width: .8; }
.art .hexp.reach { stroke: var(--good); stroke-width: 2; }
.hexside { fill: #6b4a2b; stroke: #3b2716; stroke-width: 1; pointer-events: none; }
.hexhit { fill: transparent; stroke: none; cursor: pointer; }
.centre:has(.hand:not([hidden])) svg#board { max-height: max(300px, calc(100vh - 300px)); }
.hand { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px 8px; display: flex; flex-direction: column; gap: 5px; }
.hand.A { box-shadow: inset 3px 0 0 var(--a); } .hand.B { box-shadow: inset 3px 0 0 var(--b); }
.handhd { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 12px; color: var(--dim); }
.handhd b { font-family: var(--display); color: var(--fg); font-size: 13px; }
.handhd .legend2 { margin-left: auto; font-size: 11px; }
.handrow { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.hgroup { display: flex; flex-direction: column; gap: 3px; }
.hgroup .who { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.hgroup .who img { width: 22px; height: 22px; object-fit: cover; object-position: 50% 0; border-radius: 50%; background: #2a3448; }
.hgroup .two { display: flex; gap: 4px; }
.ocard { padding: 3px 7px; font-family: var(--mono); font-size: 12.5px; display: flex; gap: 6px; border-radius: 5px; }
.ocard:not([disabled]):hover { border-color: var(--gold); background: #2c2614; }
.ocard[disabled] { opacity: .8; cursor: default; }
.tint { pointer-events: none; stroke: none; fill: none; }
.tint.hill { fill: #e0b75a55; } .tint.tower { fill: #9aa0ab70; } .tint.nexA { fill: #5ab4ff50; } .tint.nexB { fill: #ff7a5950; }
.tint.reach { fill: #7bd88f45; } .tint.hover { fill: #7bd88f90; }
.art .lbl { fill: #f3f6fb; paint-order: stroke; stroke: #0b0f16; stroke-width: 2px; }
.spr { pointer-events: none; } .tok.mine .spr { pointer-events: auto; cursor: pointer; }
.sprw { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.035, .965); } }
.tok.actor .sprw { animation: lunge .2s ease-out 1 both; }
@keyframes lunge { 0% { transform: translate(0, 0); } 45% { transform: translate(var(--dx), var(--dy)) scale(1.1, .92); } 100% { transform: translate(0, 0); } }
.hit .spr, .spr.hit { animation: hitflash .3s ease-out 1; }
@keyframes hitflash { 0% { filter: brightness(2.6) saturate(0); transform: translateX(-3px); } 30% { transform: translateX(3px); } 60% { filter: brightness(1.4); transform: translateX(-2px); } 100% { filter: none; transform: none; } }
.tok ellipse.body { stroke-width: 2.5; }
.tok.A ellipse.body { fill: #5ab4ff40; stroke: var(--a); } .tok.B ellipse.body { fill: #ff7a5940; stroke: var(--b); }
.tok.sel ellipse.body { stroke: var(--gold); stroke-width: 3.5; fill: #e7b75a40; }
.tok.actor ellipse.body { stroke: #fff; stroke-width: 3.5; }
.foot { fill: #00000055; pointer-events: none; }
.pt { width: 34px; height: 34px; object-fit: cover; object-position: 50% 0; border-radius: 50%; background: #2a3448; border: 1px solid var(--line); flex: none; align-self: center; }
.card .hd:has(.pt) { align-items: center; }
.art .pop { font-size: 17px; }
/* Effects (D-076): one look per kind of action, all code-drawn */
.fx { pointer-events: none; }
.fx * { transform-box: fill-box; transform-origin: center; }
.slash { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 60; stroke-dashoffset: 60; filter: drop-shadow(0 0 3px #fff8); animation: slash .26s ease-out forwards; }
@keyframes slash { 60% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
.proj { animation: fly .2s ease-in both; }
@keyframes fly { from { transform: translate(var(--fx), var(--fy)); } 90% { opacity: 1; } to { transform: translate(0, 0); opacity: 0; } }
.burst { animation: burst .32s ease-out .14s both; }
@keyframes burst { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
.bolt { fill: none; stroke-width: 3; stroke-linejoin: round; filter: drop-shadow(0 0 4px currentColor); animation: flicker .3s steps(3) both; }
@keyframes flicker { 0% { opacity: 1; } 50% { opacity: .35; } 100% { opacity: 0; } }
.ring { fill: none; stroke-width: 4; animation: ring .55s ease-out both; }
@keyframes ring { from { transform: scale(.15); opacity: 1; } to { transform: scale(1); opacity: 0; } }
.rune { animation: rune .6s ease-out both; }
@keyframes rune { 0% { opacity: 0; transform: scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.15); } }
.rise { animation: rise .6s ease-out both; }
@keyframes rise { from { transform: translateY(6px); opacity: 1; } to { transform: translateY(-22px); opacity: 0; } }
.bubble-in { animation: bubblein .4s ease-out both; }
@keyframes bubblein { from { transform: scale(.4); opacity: 0; } 60% { opacity: 1; } to { transform: scale(1); opacity: .8; } }
/* Statuses shown on the champion */
.stv { pointer-events: none; }
.pbub { fill: #8fdc6e; animation: pbub 1.3s ease-in infinite; }
@keyframes pbub { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-26px); opacity: 0; } }
.ice { fill: #cdeeff55; stroke: #e9f8ff; stroke-width: 1.5; }
.shieldb { fill: #9fd8ff22; stroke: #9fd8ffcc; stroke-width: 1.5; }
.roots { fill: none; stroke: #5f8f3a; stroke-width: 3; stroke-dasharray: 3 4; }
.blindc { fill: #2b2f3acc; }
.art .tok .st { font-size: 15px; }
.pop { font-family: var(--display); font-weight: 700; font-size: 14px; text-anchor: middle; paint-order: stroke; stroke: #0b0f16; stroke-width: 3px; pointer-events: none; }
.pop.bad { fill: var(--bad); } .pop.good { fill: var(--good); } .pop.info { fill: var(--frost); } .pop.gold { fill: var(--gold); }

.prompt { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.prompt p { margin: 0; flex: 1 1 260px; min-width: 0; }
.prompt .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--dim); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
.log { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; height: 220px; overflow-y: auto; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
.log div { min-width: 0; overflow-wrap: anywhere; }
.log .round { color: var(--gold); font-family: var(--display); letter-spacing: .06em; margin-top: 4px; }
.log .A { color: #b9dcff; } .log .B { color: #ffc2b2; }
.log .sys { color: var(--dim); }
.log .kill { color: var(--bad); font-weight: 600; }
.log em { font-style: normal; color: var(--gold); }

.overlay { position: fixed; inset: 0; background: #070a10d9; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; z-index: 20; padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: min(1180px, 100%); display: flex; flex-direction: column; gap: 12px; }
.box h2 { font-family: var(--display); margin: 0; font-size: 20px; letter-spacing: .04em; text-wrap: balance; }
.box p { margin: 0; color: var(--dim); max-width: 75ch; }
.box .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dcols { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .dcols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .dcols { grid-template-columns: minmax(0, 1fr); } }
.dcols h3 { font-family: var(--display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 0 0 6px; }
.dcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.dcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.dcard.pick { cursor: pointer; } .dcard.pick:hover { border-color: var(--gold); }
.dcard.taken { opacity: .35; }
.dcard.A { border-color: var(--a); } .dcard.B { border-color: var(--b); }
.dcard b.n { font-family: var(--display); font-size: 15px; }
.lvl { display: grid; grid-template-columns: minmax(0, 160px) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: stretch; }
@media (max-width: 560px) { .lvl { grid-template-columns: minmax(0, 1fr); } }
.lvl .who { display: flex; flex-direction: column; justify-content: center; }
.lvl .who b { font-family: var(--display); font-size: 15px; }
.lvl button { text-align: left; }
.lvl button.chosen { border-color: var(--gold); background: #2c2614; }
.help { font-size: 13.5px; color: var(--fg); }
.help h3 { font-family: var(--display); font-size: 14px; letter-spacing: .08em; margin: 8px 0 2px; color: var(--gold); }
.help p { color: var(--fg); }
.shop { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .shop { grid-template-columns: minmax(0, 1fr); } }
.shop .item { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.shop .item.sel { border-color: var(--gold); }
.shop .item b { font-family: var(--display); font-size: 15px; }
.shop .item .cost { color: var(--gold); font-family: var(--mono); }
.special { font-size: 11.5px; color: var(--fg); }
.special b { color: var(--gold); }
.pips { letter-spacing: 2px; color: var(--gold); font-family: var(--mono); }
.stat-strip { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--dim); }
.stat-strip b { color: var(--fg); font-family: var(--mono); font-weight: 500; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="brand">Augury<small>skirmish</small></div>
  <div class="meter"><span>Round</span><b id="m-round" class="num">–</b></div>
  <div class="meter"><span>Nexus A</span><b id="m-nexA" class="A num">30</b></div>

<div id="overlay" class="overlay" hidden></div>

  const team = G.order[G.di], human = G.humans.includes(team);
  const box = h(`<div class="box"><div class="row"><h2>Draft: ${human ? 'your pick' : 'the AI picks'} (team ${team})</h2><div class="row" style="margin-left:auto">
      <button data-m="play">Play A vs AI</button><button data-m="watch">Watch AI vs AI</button><button data-m="board">Board: ${BOARDS[UI.board].name} ⇄</button><button data-m="nexus">${structure() ? 'Nexus: destroy it' : 'Nexus: score'} ⇄</button><button data-m="pulse">${RULES.onePulse ? 'Pulse: once per round' : 'Pulse: after every move'} ⇄</button><button data-m="rules">Rules</button></div></div>
    <p>Snake order A B B A A B B A A B, one champion per role. Look at tags: an aura helps every ally beside its owner, a bond needs a neighbour with the named tag.</p><div class="dcols"></div></div>`);
  const cols = box.querySelector('.dcols');
  for (const role of ROLES) { const col = h(`<div class="dcol"><h3>${role}</h3></div>`);
    for (const d of ROSTER.filter(x => x.role === role)) { const takenBy = ['A','B'].find(t => G.picks[t].includes(d));
      const can = human && !takenBy && !G.picks[team][ROLES.indexOf(role)];
      const fake = { def: d, procs: d.procs, auraAmt: d.aura ? d.aura.amt : 0, pos: [99, 99], team: 'A', init: d.init, atk: d.atk, range: d.range, bounty: 0 };
      const card = h(`<div class="dcard ${can ? 'pick' : ''} ${takenBy ? 'taken ' + takenBy : ''}">
        <div style="display:flex;gap:8px;align-items:center">${UI.art ? `<img class="pt" src="art/${d.id}.png" alt="">` : ''}<b class="n">${esc(d.name)}</b> <span class="chip">${d.tag}</span>${takenBy ? ` <span class="chip">team ${takenBy}</span>` : ''}</div>
        <div class="stats">HP <b>${d.hp}</b> ATK <b>${d.atk}</b> RNG <b>${d.range}</b> INIT <b>${d.init}</b>${d.dive ? ` LEAP <b>${d.dive}</b>` : ''}</div>
        <div class="stats"><span class="chip rule">targets: ${RULE_TEXT[d.target]}</span>${synText(fake)}</div>
        <div class="procs">${Object.keys(d.procs).map(k => `<span>${PROCS[k].name}</span><span class="bar"><i style="width:${d.procs[k]}%;background:${PROCS[k].color}"></i></span><span class="pct">${d.procs[k]}%</span>`).join('')}</div>
        <div class="next">Grows into: ${d.tree.map(o => esc(o[0].t) + ' / ' + esc(o[1].t)).join(' · ')}</div></div>`);
      if (can) card.addEventListener('click', () => draftPick(d));
      col.appendChild(card); }
    cols.appendChild(col); }
  box.querySelectorAll('button[data-m]').forEach(b => b.addEventListener('click', () => { const m = b.dataset.m;
    if (m === 'rules') { UI.rules = true; render(); } else if (m === 'nexus') document.getElementById('b-nexus').click(); else if (m === 'pulse') document.getElementById('b-pulse').click(); else if (m === 'board') { UI.board = UI.board === 'field7' ? 'small' : 'field7'; newMatch(G.mode); } else newMatch(m); }));
  ov.appendChild(box);
}

// ═════════════ headless runs (for measuring) ═════════════
function simulate(n, board, seed = 1, rules = {}) {
  const keepB = UI.board, keepS = { ...STATS }, keepR = { ...RULES };
  const keepP = AIP.push, keepG = AIP.greedy; AIP.push = rules.aiPush ?? 4; AIP.greedy = rules.greedy ?? null; Object.assign(RULES, rules);
  STATS = freshStats();
  HEADLESS = true; UI.board = board || keepB;
  const ends = { nexus: 0, time: 0 };
  for (let i = 0; i < n; i++) { newMatch('watch', seed + i * 7919); if (G.round >= RULES.rounds && G.nexus.A > 0 && G.nexus.B > 0) ends.time++; else ends.nexus++; }
  const S = STATS; window.STATS_last = { ...STATS };
  const out = { rounds: +(S.rounds / n).toFixed(1), byNexus: Math.round(100 * ends.nexus / n) + '%', deaths: +(S.deaths / n).toFixed(1), winA: Math.round(100 * S.winsA / n) + '%',
    fightWinThenWin: S.fw ? Math.round(100 * S.fwWin / S.fw) + '%' : '-', bigFightThenWin: S.big ? Math.round(100 * S.bigWin / S.big) + '%' : '-', bigFightShare: Math.round(100 * S.big / n) + '%', towersFallen: +(S.falls / n).toFixed(1),
    swingBack: S.after ? Math.round(100 * S.rev / S.after) + '%' : '-', nextKills: S.after ? `${(S.nkW / S.after).toFixed(2)} vs ${(S.nkL / S.after).toFixed(2)}` : '-', towerNextRound: S.after ? Math.round(100 * S.conv / S.after) + '%' : '-', kills2Rounds: S.after ? `${(S.k2W / S.after).toFixed(2)} vs ${(S.k2L / S.after).toFixed(2)}` : '-', swingBack2: S.after ? Math.round(100 * (S.rev + S.rev2) / S.after) + '%' : '-', goldLeadAt5Wins: S.gl ? Math.round(100 * S.glWin / S.gl) + '%' : '-', itemsPerMatch: +(S.items / n).toFixed(1), specialsPerMatch: +(S.specials / n).toFixed(1), skipsPerMatch: +(S.skips / n).toFixed(1), comeback: S.fw ? Math.round(100 - 100 * S.fwWin / S.fw) + '%' : '-', towerIn2: S.after ? Math.round(100 * S.conv2 / S.after) + '%' : '-', punished: S.after ? Math.round(100 * S.punished / S.after) + '%' : '-', stepsPerPulse: S.stancePulses ? +(S.steps / S.stancePulses).toFixed(2) : 0, dragons: +(S.dragons / n).toFixed(2), barons: +(S.barons / n).toFixed(2), baronTakerWins: S.barons ? Math.round(100 * S.baronWin / S.barons) + '%' : '-', baronWhenBehind: S.baronBehind ? `${S.baronBehind} taken, ${Math.round(100 * S.baronBehindWin / S.baronBehind)}% won` : '-', steals: S.barons + S.dragons ? Math.round(100 * S.steals / (S.barons + S.dragons)) + '%' : '-' };
  HEADLESS = false; UI.board = keepB; STATS = keepS; Object.assign(RULES, keepR); AIP.push = keepP; AIP.greedy = keepG; delete RULES.aiPush; delete RULES.greedy; newMatch('play');
  return out;
}

// ═════════════ wiring ═════════════
document.getElementById('b-play').addEventListener('click', () => newMatch('play'));
document.getElementById('b-watch').addEventListener('click', () => newMatch('watch'));
document.getElementById('b-board').addEventListener('click', () => { UI.board = UI.board === 'field7' ? 'small' : 'field7'; newMatch(G.mode); });
document.getElementById('b-aims').addEventListener('click', () => { UI.aims = !UI.aims; render(); });
document.getElementById('b-art').addEventListener('click', () => { UI.art = !UI.art; render(); });
document.getElementById('b-speed').addEventListener('click', () => { UI.speed = UI.speed === 'normal' ? 'fast' : 'normal'; render(); });
document.getElementById('b-nexus').addEventListener('click', () => { Object.assign(RULES, structure() ? SCORE : DESTROY); newMatch(G.mode); });
document.getElementById('b-pulse').addEventListener('click', () => { Object.assign(RULES, RULES.onePulse ? EVERY_MOVE : ONE_PULSE); newMatch(G.mode); });
document.getElementById('b-rules').addEventListener('click', () => { UI.rules = true; render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (UI.rules) { UI.rules = false; render(); } else if (UI.sel != null) { UI.sel = null; UI.hover = null; render(); } } });
newMatch('play');
</script>
