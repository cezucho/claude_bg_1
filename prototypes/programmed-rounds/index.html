<script>
'use strict';
// ───────────── geometry ─────────────
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const DIRNAME = ['right','up-right','up-left','left','down-left','down-right'];
const HEX = 34, SQ3 = Math.sqrt(3);
const key = (q, r) => q + ',' + r;
const dist = (a, b) => (Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[0]+a[1]-b[0]-b[1])) / 2;
const add = (a, b) => [a[0]+b[0], a[1]+b[1]];
const same = (a, b) => a && b && a[0] === b[0] && a[1] === b[1];
const rot60 = ([q, r]) => [-r, q + r];
function rot(h, n) { let p = h; for (let i = 0; i < ((n % 6) + 6) % 6; i++) p = rot60(p); return p; }
// Team B is team A's mirror image across the river row (x kept, r negated), so each role
// starts opposite the same role — the lanes line up, as in the main game.
const mirror = ([q, r]) => [q + r, -r];
const frame = (team, off) => team === 'A' ? off : mirror(off);
const hexagon = n => { const o = []; for (let q = -n; q <= n; q++) for (let r = -n; r <= n; r++) if (Math.abs(q + r) <= n) o.push([q, r]); return o; };
const BOARDS = {
  small: { name: 'Small (37 hexes)', hexes: hexagon(3), nexusA: [[1,-3]], centre: [0,0], homeA: [[3,-1]], hills: [[-3,0],[3,0]],
    startA: [[-1,-2],[0,-2],[1,-2],[2,-2],[3,-2]] },
  field7: { name: 'Field 7 (59 hexes)', hexes: [[-2,-3],[-1,-3],[0,-3],[1,-3],[2,-3],[3,-3],[4,-3],[5,-3],[-3,-2],[-2,-2],[-1,-2],[0,-2],[1,-2],[2,-2],[3,-2],[4,-2],[5,-2],[-3,-1],[-2,-1],[-1,-1],[0,-1],[1,-1],[2,-1],[3,-1],[4,-1],[-4,0],[-3,0],[-2,0],[-1,0],[0,0],[1,0],[2,0],[3,0],[4,0],[-4,1],[-3,1],[-2,1],[-1,1],[0,1],[1,1],[2,1],[3,1],[-5,2],[-4,2],[-3,2],[-2,2],[-1,2],[0,2],[1,2],[2,2],[3,2],[-5,3],[-4,3],[-3,3],[-2,3],[-1,3],[0,3],[1,3],[2,3]],
    // the main game's Field 7: the nexus is a line of three hexes on the start line, the fronts six rows apart
    nexusA: [[0,-3],[1,-3],[2,-3]], centre: [0,0], homeA: [[-2,-1],[3,-1]], hills: [[-1,-1],[2,-1],[-4,0],[4,0]],
    startA: [[-1,-3],[0,-3],[1,-3],[2,-3],[3,-3]] },
};
let HEXES, HEXSET, NEXUS, TOWERS, HILLS, SOLID, START, BOARD;
function setBoard(name) {
  BOARD = BOARDS[name] || BOARDS.small;
  HEXES = BOARD.hexes; HEXSET = new Set(HEXES.map(h => key(...h)));
  NEXUS = { A: BOARD.nexusA, B: BOARD.nexusA.map(mirror) };   // nexus hexes are walkable: champions start on them
  TOWERS = [BOARD.centre, ...BOARD.homeA, ...BOARD.homeA.map(mirror)];
  HILLS = [...BOARD.hills, ...BOARD.hills.map(mirror).filter(h => !BOARD.hills.some(x => same(x, h)))];
  SOLID = new Set(TOWERS.map(h => key(...h)));
  START = { A: BOARD.startA, B: BOARD.startA.map(mirror) };
}
setBoard('small');
const onBoard = h => HEXSET.has(key(...h));
const px = (q, r) => [HEX * SQ3 * (q + r / 2), -HEX * 1.5 * r];
const other = t => t === 'A' ? 'B' : 'A';
const nexusDist = (team, h) => Math.min(...NEXUS[team].map(n => dist(n, h)));
const isNexus = (team, h) => NEXUS[team].some(n => same(n, h));

// ───────────── content ─────────────
// Every ability is a card with two sides. The MAIN action is secret until the reveal and fires on its
// initiative (4 first → 1 last). The OPEN effect happens the moment the card is put down, in front of
// both players — it is the hint. Two of each champion's three cards share the same open effect, so a
// hint narrows the card down without always naming it.
// kinds: track (follows a champion) · hex (a hex) · rot (a pattern, you choose the facing) · fixed (pattern, forward) · self
const LINE = [[1,0],[2,0],[3,0]], CONE = [[1,0],[2,-1],[2,0],[1,1],[3,0]], FRONT1 = [[1,0]];
const BLAST = [[0,1],[-1,1],[1,0],[0,2],[-1,2]];   // forward frame (+r), mirrored for B
const RING = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
// open effects
const step = n => ({ o: 'step', n }), swap = r => ({ o: 'swap', r }), mend = (n, r) => ({ o: 'mend', n, r }), guard = n => ({ o: 'guard', n }),
      chip = (n, r) => ({ o: 'chip', n, r }), shove = () => ({ o: 'shove' }), siege = (n, r) => ({ o: 'siege', n, r });
const ROSTER = [
  { id:'anchor', name:'Anchor', role:'Top', hp:17, gives:'Rooted', wants:'Marked', abilities:[
    { name:'Chain Hook', init:2, kind:'hex', range:2, dmg:4, status:'Rooted', open:[step(1)] },
    { name:'Stand Firm', init:4, kind:'self', shield:6, open:[guard(2)] },
    { name:'Groundswell', init:4, kind:'fixed', pattern:BLAST, dmg:6, open:[step(1)] } ] },
  { id:'bulwark', name:'Bulwark', role:'Top', hp:18, gives:'Exhausted', wants:null, abilities:[
    { name:'Bash', init:3, kind:'rot', pattern:FRONT1, dmg:5, status:'Exhausted', open:[shove()] },
    { name:'Rampart', init:4, kind:'fixed', pattern:RING, shield:4, ally:true, open:[swap(2)] },
    { name:'Quake', init:4, kind:'fixed', pattern:BLAST, dmg:6, open:[swap(2)] } ] },
  { id:'ember', name:'Ember', role:'Jungle', hp:13, gives:'Burning', wants:'Exhausted', abilities:[
    { name:'Kindle', init:1, kind:'track', range:2, dmg:4, status:'Burning', open:[step(2)] },
    { name:'Flare', init:2, kind:'hex', range:3, dmg:5, status:'Burning', open:[chip(1, 3)] },
    { name:'Wildfire', init:3, kind:'rot', pattern:CONE, dmg:5, open:[step(2)] } ] },
  { id:'viper', name:'Viper', role:'Jungle', hp:13, gives:null, wants:'Rooted', abilities:[
    { name:'Fang', init:1, kind:'track', range:1, dmg:7, open:[step(2)] },
    { name:'Lunge', init:2, kind:'hex', range:2, dmg:6, open:[step(2)] },
    { name:'Ambush', init:3, kind:'rot', pattern:LINE, dmg:6, open:[step(1)] } ] },
  { id:'lens', name:'Lens', role:'Mid', hp:12, gives:'Marked', wants:'Burning', abilities:[
    { name:'Mark', init:2, kind:'hex', range:3, dmg:3, status:'Marked', open:[step(1)] },
    { name:'Lance', init:3, kind:'rot', pattern:LINE, dmg:6, open:[step(1)] },
    { name:'Refraction', init:4, kind:'fixed', pattern:BLAST, dmg:4, status:'Marked', open:[chip(1, 3)] } ] },
  { id:'tempest', name:'Tempest', role:'Mid', hp:12, gives:'Exhausted', wants:null, abilities:[
    { name:'Zap', init:1, kind:'track', range:3, dmg:5, open:[chip(1, 3)] },
    { name:'Gust', init:2, kind:'hex', range:2, dmg:4, status:'Exhausted', open:[step(2)] },
    { name:'Eye of the Storm', init:4, kind:'fixed', pattern:BLAST, dmg:6, open:[chip(1, 3)] } ] },
  { id:'ranger', name:'Ranger', role:'Bottom', hp:12, gives:'Rooted', wants:null, abilities:[
    { name:'Volley', init:1, kind:'track', range:3, dmg:5, open:[step(1)] },
    { name:'Pin Shot', init:2, kind:'hex', range:3, dmg:4, status:'Rooted', open:[step(1)] },
    { name:'Rain of Arrows', init:4, kind:'fixed', pattern:BLAST, dmg:6, open:[guard(2)] } ] },
  { id:'gunner', name:'Gunner', role:'Bottom', hp:12, gives:null, wants:'Rooted', abilities:[
    { name:'Snipe', init:1, kind:'track', range:3, dmg:6, open:[step(1)] },
    { name:'Recoil', init:2, kind:'hex', range:2, dmg:5, open:[step(1)] },
    { name:'Buckshot', init:3, kind:'rot', pattern:CONE, dmg:5, open:[siege(2, 3)] } ] },
  { id:'oriel', name:'Oriel', role:'Support', hp:14, gives:null, wants:null, abilities:[
    { name:'Mend', init:1, kind:'track', range:2, heal:7, ally:true, open:[mend(1, 1)] },
    { name:'Tether', init:4, kind:'track', range:2, shield:6, ally:true, open:[mend(1, 1)] },
    { name:'Sanctuary', init:3, kind:'fixed', pattern:RING, heal:3, shield:3, ally:true, open:[swap(2)] } ] },
  { id:'seer', name:'Seer', role:'Support', hp:14, gives:'Marked', wants:null, abilities:[
    { name:'Omen', init:1, kind:'track', range:3, dmg:2, status:'Marked', open:[step(1)] },
    { name:'Curse', init:2, kind:'hex', range:2, dmg:4, open:[step(1)] },
    { name:'Revelation', init:4, kind:'fixed', pattern:BLAST, dmg:3, status:'Marked', open:[chip(1, 2)] } ] },
];
const ROLES = ['Top','Jungle','Mid','Bottom','Support'];
// Openings, as in the main game: each ability owns a script of three instructions in the team's
// frame (forward = toward the enemy). "role dir" moves that role one hex; "cast" fires the ability
// that owns the script, auto-aimed. Exactly one of a champion's three openings casts. Moves are
// strict: a script is playable only if all its moves can execute in order.
const ODIR = { fr: [0, 1], fl: [-1, 1], r: [1, 0], l: [-1, 0], br: [1, -1], bl: [0, -1] };
const OARROW = { A: { fr: '↗', fl: '↖', r: '→', l: '←', br: '↘', bl: '↙' }, B: { fr: '↘', fl: '↙', r: '→', l: '←', br: '↗', bl: '↖' } };
const OPENINGS = {   // written for Field 7's back row; three different routes per champion, so one blocked hex doesn't void them all
  anchor:  [['top fr', 'top fr', 'cast'],            ['top fl', 'top fl', 'jungle fl'],      ['top fr', 'top r', 'mid fr']],
  bulwark: [['top fl', 'top fl', 'support fl'],      ['top fr', 'top r', 'jungle fl'],       ['top fr', 'top fr', 'cast']],

// Headless: index.html#sim=200 (or #sim=200,small) plays AI matches with no timers and prints the counters.

    deathsPerRound: +(s.deaths / s.rounds).toFixed(2), dmgPerRoundPctOfHP: +(100 * s.dmg / s.hpPool).toFixed(1), burstShare: +(s.bursts / Math.max(1, s.deaths)).toFixed(2), lostPerRound: +(s.lost / s.rounds).toFixed(2), fizzPerRound: +(s.fizz / s.rounds).toFixed(2), leadChanges: s.leadChanges, by: Object.entries(s.by).sort().map(([k, v]) => k + ' ' + +(v / s.matches).toFixed(2)).join(', '), champs: Object.entries(s.champ).map(([k, v]) => k + ' ' + Math.round(100 * v[1] / v[0])).join(', ') };

// Debug: play to round 1, ask A's AI for a card, mirror the board with the teams swapped, ask B's AI. They should agree.

  SIMQ = [];
  let t0; const desc = pl => `${pl.c.def.name} ${pl.c.def.abilities[pl.i].name} step ${pl.choices[0] ? fmt(pl.c.team === t0 ? pl.choices[0] : mirror(pl.choices[0])) : '-'} v ${pl.v.toFixed(4)}`;
  t0 = G.placeTurn; const a = aiPlace(t0), da = desc(a);

  const b = aiPlace(other(t0)), db = desc(b);

// Debug: #uitest=N plays as A through the real buttons until round N, then stops with a card half-placed (for a screenshot).

  const drain = () => { let k = 0; while (SIMQ.length && k++ < 2000) { const f = SIMQ.shift(); f(); if (G.phase === 'program' && G.humans.includes(G.placeTurn)) break; if (G.phase === 'opening' && G.openingTurn === 'A') break; if (G.phase === 'draft' && G.draftOrder[G.draftIdx] === 'A') break; } };

  while (g++ < 400 && G.phase !== 'over') {
