<style>

}

.log .b.t4 { border-left-color: #ff9a3c; } .log .b.t3 { border-left-color: #b07aff; } .log .b.t2 { border-left-color: #5a9dff; } .log .b.t1 { border-left-color: #3fd6a0; }
.log .b.lost { color: var(--cut); } .log .b.fizz { color: var(--dim); } .log .b.death { color: var(--bad); font-weight: 700; } .log .b.round { color: var(--gold); font-weight: 700; margin-top: 4px; }
.overlay { position: fixed; inset: 0; background: rgba(5,7,12,.9); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; z-index: 20; padding: 20px max(16px, env(safe-area-inset-left, 0px)); }

<script>
'use strict';
// ───────────── geometry ─────────────
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const DIRNAME = ['right','up-right','up-left','left','down-left','down-right'];
const HEX = 34, SQ3 = Math.sqrt(3);
const key = (q, r) => q + ',' + r;
const dist = (a, b) => (Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[0]+a[1]-b[0]-b[1])) / 2;
const add = (a, b) => [a[0]+b[0], a[1]+b[1]];
const same = (a, b) => a && b && a[0] === b[0] && a[1] === b[1];
const rot60 = ([q, r]) => [-r, q + r];
function rot(h, n) { let p = h; for (let i = 0; i < ((n % 6) + 6) % 6; i++) p = rot60(p); return p; }
// Team B is team A's mirror image across the river row (x kept, r negated), so each role
// starts opposite the same role — the lanes line up, as in the main game.
const mirror = ([q, r]) => [q + r, -r];
const frame = (team, off) => team === 'A' ? off : mirror(off);
const hexagon = n => { const o = []; for (let q = -n; q <= n; q++) for (let r = -n; r <= n; r++) if (Math.abs(q + r) <= n) o.push([q, r]); return o; };
const BOARDS = {
  small: { name: 'Small (37 hexes)', hexes: hexagon(3), nexusA: [[1,-3]], centre: [0,0], homeA: [[3,-1]], hills: [[-3,0],[3,0]],
    startA: [[-1,-2],[0,-2],[1,-2],[2,-2],[3,-2]] },
  field7: { name: 'Field 7 (59 hexes)', hexes: [[-2,-3],[-1,-3],[0,-3],[1,-3],[2,-3],[3,-3],[4,-3],[5,-3],[-3,-2],[-2,-2],[-1,-2],[0,-2],[1,-2],[2,-2],[3,-2],[4,-2],[5,-2],[-3,-1],[-2,-1],[-1,-1],[0,-1],[1,-1],[2,-1],[3,-1],[4,-1],[-4,0],[-3,0],[-2,0],[-1,0],[0,0],[1,0],[2,0],[3,0],[4,0],[-4,1],[-3,1],[-2,1],[-1,1],[0,1],[1,1],[2,1],[3,1],[-5,2],[-4,2],[-3,2],[-2,2],[-1,2],[0,2],[1,2],[2,2],[3,2],[-5,3],[-4,3],[-3,3],[-2,3],[-1,3],[0,3],[1,3],[2,3]],
    // the main game's Field 7: the nexus is a line of three hexes on the start line, the fronts six rows apart
    nexusA: [[0,-3],[1,-3],[2,-3]], centre: [0,0], homeA: [[-2,-1],[3,-1]], hills: [[-1,-1],[2,-1],[-4,0],[4,0]],
    startA: [[-1,-3],[0,-3],[1,-3],[2,-3],[3,-3]] },
};
let HEXES, HEXSET, NEXUS, TOWERS, HILLS, SOLID, START, BOARD;
function setBoard(name) {
  BOARD = BOARDS[name] || BOARDS.small;
  HEXES = BOARD.hexes; HEXSET = new Set(HEXES.map(h => key(...h)));
  NEXUS = { A: BOARD.nexusA, B: BOARD.nexusA.map(mirror) };   // nexus hexes are walkable: champions start on them
  TOWERS = [BOARD.centre, ...BOARD.homeA, ...BOARD.homeA.map(mirror)];
  HILLS = [...BOARD.hills, ...BOARD.hills.map(mirror).filter(h => !BOARD.hills.some(x => same(x, h)))];
  SOLID = new Set(TOWERS.map(h => key(...h)));
  START = { A: BOARD.startA, B: BOARD.startA.map(mirror) };
}
setBoard('small');
const onBoard = h => HEXSET.has(key(...h));
const px = (q, r) => [HEX * SQ3 * (q + r / 2), -HEX * 1.5 * r];
const other = t => t === 'A' ? 'B' : 'A';
const nexusDist = (team, h) => Math.min(...NEXUS[team].map(n => dist(n, h)));
const isNexus = (team, h) => NEXUS[team].some(n => same(n, h));

// ───────────── content ─────────────
// kinds: track (tier 1: commits a champion, follows it) · hex (tier 2: commits a hex) · rot (tier 3: commits a facing) · fixed (tier 4: forward pattern)
const LINE = [[1,0],[2,0],[3,0]], CONE = [[1,0],[1,-1],[2,-1],[2,0],[3,-1]];
const BLAST = [[0,1],[-1,1],[1,0],[0,2],[-1,2]];   // forward frame (+r), rotated for B
const ROSTER = [
  { id:'anchor', name:'Anchor', role:'Top', hp:28, gives:'Rooted', wants:'Marked', abilities:[
    { name:'Chain Hook', init:2, kind:'hex', range:2, dmg:4, status:'Rooted' },
    { name:'Stand Firm', init:1, kind:'self', shield:5 },
    { name:'Groundswell', init:4, kind:'fixed', pattern:BLAST, dmg:6 } ] },
  { id:'bulwark', name:'Bulwark', role:'Top', hp:30, gives:'Exhausted', wants:null, abilities:[
    { name:'Shove', init:1, kind:'track', range:1, dmg:3, status:'Exhausted' },
    { name:'Rampart', init:2, kind:'self', shield:6 },
    { name:'Quake', init:4, kind:'fixed', pattern:BLAST, dmg:5, status:'Exhausted' } ] },
  { id:'ember', name:'Ember', role:'Jungle', hp:22, gives:'Burning', wants:'Exhausted', abilities:[
    { name:'Kindle', init:1, kind:'track', range:2, dmg:2, status:'Burning' },
    { name:'Flare', init:2, kind:'hex', range:3, dmg:4, status:'Burning' },
    { name:'Wildfire', init:3, kind:'rot', pattern:CONE, dmg:5 } ] },
  { id:'viper', name:'Viper', role:'Jungle', hp:22, gives:null, wants:'Rooted', abilities:[
    { name:'Fang', init:1, kind:'track', range:1, dmg:6 },
    { name:'Lunge', init:2, kind:'hex', range:2, dmg:4 },
    { name:'Ambush', init:3, kind:'rot', pattern:LINE, dmg:5 } ] },
  { id:'lens', name:'Lens', role:'Mid', hp:22, gives:'Marked', wants:'Burning', abilities:[
    { name:'Mark', init:2, kind:'hex', range:3, dmg:2, status:'Marked' },
    { name:'Lance', init:3, kind:'rot', pattern:LINE, dmg:5 },
    { name:'Refraction', init:4, kind:'fixed', pattern:BLAST, dmg:4, status:'Marked' } ] },
  { id:'tempest', name:'Tempest', role:'Mid', hp:22, gives:'Exhausted', wants:null, abilities:[
    { name:'Zap', init:1, kind:'track', range:3, dmg:3 },
    { name:'Gust', init:2, kind:'hex', range:2, dmg:3, status:'Exhausted' },
    { name:'Eye of the Storm', init:4, kind:'fixed', pattern:BLAST, dmg:6 } ] },
  { id:'ranger', name:'Ranger', role:'Bottom', hp:23, gives:'Rooted', wants:null, abilities:[
    { name:'Volley', init:1, kind:'track', range:3, dmg:4 },
    { name:'Pin Shot', init:2, kind:'hex', range:3, dmg:3, status:'Rooted' },
    { name:'Rain of Arrows', init:4, kind:'fixed', pattern:BLAST, dmg:6 } ] },
  { id:'gunner', name:'Gunner', role:'Bottom', hp:24, gives:null, wants:'Rooted', abilities:[
    { name:'Snipe', init:1, kind:'track', range:3, dmg:5 },
    { name:'Recoil', init:2, kind:'hex', range:2, dmg:4 },
    { name:'Buckshot', init:3, kind:'rot', pattern:CONE, dmg:4 } ] },
  { id:'oriel', name:'Oriel', role:'Support', hp:26, gives:null, wants:null, abilities:[
    { name:'Mend', init:1, kind:'track', range:2, heal:7, ally:true },
    { name:'Tether', init:2, kind:'track', range:2, shield:5, ally:true },
    { name:'Sanctuary', init:4, kind:'fixed', pattern:BLAST, heal:4, ally:true } ] },
  { id:'seer', name:'Seer', role:'Support', hp:25, gives:'Marked', wants:null, abilities:[
    { name:'Omen', init:1, kind:'track', range:3, dmg:1, status:'Marked' },
    { name:'Curse', init:2, kind:'hex', range:2, dmg:3 },
    { name:'Revelation', init:4, kind:'fixed', pattern:BLAST, dmg:3, status:'Marked' } ] },
];
const ROLES = ['Top','Jungle','Mid','Bottom','Support'];
// Openings, as in the main game: each ability owns a script of three instructions in the team's
// frame (forward = toward the enemy). "role dir" moves that role one hex; "cast" fires the ability
// that owns the script, auto-aimed. Exactly one of a champion's three openings casts. Moves are
// strict: a script is playable only if all its moves can execute in order.
const ODIR = { fr: [0, 1], fl: [-1, 1], r: [1, 0], l: [-1, 0], br: [1, -1], bl: [0, -1] };
const OARROW = { A: { fr: '↗', fl: '↖', r: '→', l: '←', br: '↘', bl: '↙' }, B: { fr: '↘', fl: '↙', r: '→', l: '←', br: '↗', bl: '↖' } };
const OPENINGS = {   // written for Field 7's back row; three different routes per champion, so one blocked hex doesn't void them all
  anchor:  [['top fr', 'top fr', 'cast'],            ['top fl', 'top fl', 'jungle fl'],      ['top fr', 'top r', 'mid fr']],
  bulwark: [['top fl', 'top fl', 'support fl'],      ['top fr', 'top r', 'jungle fl'],       ['top fr', 'top fr', 'cast']],
  ember:   [['jungle fr', 'jungle fr', 'cast'],      ['jungle fl', 'jungle fr', 'top fr'],   ['jungle fr', 'jungle fl', 'bottom fr']],
  viper:   [['jungle fl', 'jungle fr', 'mid fr'],    ['jungle fr', 'jungle fr', 'support fl'], ['jungle fr', 'jungle fl', 'cast']],
  lens:    [['mid fr', 'mid fr', 'cast'],            ['mid fl', 'mid fr', 'bottom fl'],      ['mid fr', 'mid fl', 'support fl']],
  tempest: [['mid fr', 'mid fr', 'cast'],            ['mid fl', 'mid fl', 'jungle fr'],      ['mid fr', 'mid fl', 'top fr']],
  ranger:  [['bottom fr', 'bottom fr', 'cast'],      ['bottom fl', 'bottom fl', 'support fl'], ['bottom fr', 'bottom fl', 'mid fr']],
  gunner:  [['bottom fr', 'bottom fr', 'cast'],      ['bottom fl', 'bottom fr', 'top fr'],   ['bottom fl', 'bottom fl', 'jungle fr']],
  oriel:   [['support fr', 'support fl', 'bottom fr'], ['support fl', 'support fl', 'cast'], ['support fr', 'support r', 'mid fr']],
  seer:    [['support fl', 'support fl', 'cast'],    ['support fr', 'support fl', 'jungle fr'], ['support fr', 'support r', 'bottom fr']],
};
const RULES = { nexus: 40, rounds: 8, openingPlays: 5, spd: 2, killTax: 4, burn: 2, gateHit: 3, alone: 1.5, want: 2, wantFloor: 3, respawn: 2, carryCap: 3 };
const energyFor = r => Math.min(10, 5 + Math.ceil(r / 2));

// ───────────── state ─────────────
let G = null;        // the match
let UI = { sel: null, mode: null, target: null, threat: true, autoTimer: null, revealing: false, board: 'field7', preview: null };
let QUIET = false;   // the AI tries openings on the real state and undoes them; no log while it does
let STATS = { deaths: 0, bursts: 0, lost: 0, fizz: 0, leadChanges: 0, lastSign: 0, decisions: 0, matches: 0, winsA: 0 };

function newMatch(watch) {
  clearTimeout(UI.autoTimer);
  setBoard(UI.board);

  if (G.phase === 'program' && sel) { const abs = (G.orders[sel.team].abilities[sel.id] || []); for (const a of abs) { const ab = sel.def.abilities[a.ab]; if (ab.kind === 'rot' || ab.kind === 'fixed') pat.push(...patternCells(sel, ab, a.target ? a.target.facing : 0).map(hh => ({ hex: hh, ally: !!ab.ally }))); if (ab.kind === 'hex') pat.push({ hex: a.target.hex, ally: false }); } }
  if (UI.revealing && G.marks) for (const mk of G.marks) if (mk.kind === 'cell') pat.push(mk);
  const threat = {};
  if (UI.threat && (G.phase === 'program' || G.phase === 'opening')) for (const hh of HEXES) { const n = threatCount(hh, G.humans[0] || 'B'); if (n) threat[key(...hh)] = n; }
  for (const hh of HEXES) {
    const k = key(...hh), [cx, cy] = px(...hh);
    const cls = ['hex']; if (HILLS.some(x => same(x, hh))) cls.push('hill'); if (TOWERS.some(x => same(x, hh))) cls.push('tower'); if (isNexus('A', hh)) cls.push('nexusA'); if (isNexus('B', hh)) cls.push('nexusB');
    if (pick.has(k)) cls.push('pick'); const pm = pat.find(p => same(p.hex, hh)); if (pm) cls.push('pat', pm.ally ? 'ally' : ''); if (threat[k]) cls.push('threat', threat[k] >= 3 ? 'hot' : '');
    const poly = sv(`<polygon class="${cls.join(' ')}" points="${hexPts(cx, cy)}"></polygon>`);
    poly.addEventListener('click', () => boardClick(hh));
    svg.appendChild(poly);
    if (TOWERS.some(x => same(x, hh))) svg.appendChild(sv(`<text class="coord" x="${cx}" y="${cy + 4}" style="font-size:11px;fill:#cfd6e6">${same(hh, BOARD.centre) ? '♜ centre' : '♜'}</text>`));
    else if (isNexus('A', hh) || isNexus('B', hh)) svg.appendChild(sv(`<text class="coord" x="${cx}" y="${cy + HEX * 0.7}" style="font-size:9px;fill:#fff">NEXUS ${isNexus('A', hh) ? 'A' : 'B'}</text>`));
    else if (HILLS.some(x => same(x, hh))) svg.appendChild(sv(`<text class="coord" x="${cx}" y="${cy + 4}" style="font-size:10px;fill:#e8c46a">▲ hill</text>`));
    else svg.appendChild(sv(`<text class="coord" x="${cx}" y="${cy + HEX * 0.7}">${hh[0]},${hh[1]}</text>`));
    if (threat[k] && !SOLID.has(k) && !isNexus('A', hh) && !isNexus('B', hh)) svg.appendChild(sv(`<text class="threat-n" x="${cx + HEX * 0.55}" y="${cy - HEX * 0.45}">${threat[k]}</text>`));
  }
  for (const mv of previewMoves) { const [x1, y1] = px(...mv.from), [x2, y2] = px(...mv.to); svg.appendChild(sv(`<circle class="ghost open" cx="${x2}" cy="${y2}" r="${HEX * 0.55}"></circle>`)); svg.appendChild(sv(`<line class="arrow" x1="${x1}" y1="${y1}" x2="${x2 - (x2 - x1) * 0.35}" y2="${y2 - (y2 - y1) * 0.35}"></line>`)); }
  // ghosts of planned moves (own team)
  if (G.phase === 'program') for (const t of G.humans) for (const id in G.orders[t].moves) { const c = G.champs[id], to = G.orders[t].moves[id]; const [x1, y1] = px(...c.pos), [x2, y2] = px(...to); svg.appendChild(sv(`<circle class="ghost" cx="${x2}" cy="${y2}" r="${HEX * 0.55}"></circle>`)); svg.appendChild(sv(`<line class="arrow" x1="${x1}" y1="${y1}" x2="${x2 - (x2 - x1) * 0.35}" y2="${y2 - (y2 - y1) * 0.35}"></line>`)); }
  for (const c of G.champs) { if (c.dead) continue; const [cx, cy] = px(...c.pos);
    const g = sv(`<g class="tok ${c.team} ${UI.sel === c.id ? 'sel' : ''} ${pick.has(key(...c.pos)) ? 'pick' : ''}"><circle class="body" cx="${cx}" cy="${cy}" r="${HEX * 0.58}"></circle><text class="g" x="${cx}" y="${cy}">${esc(c.def.name[0])}</text><rect class="tokhp" x="${cx - HEX * 0.55}" y="${cy + HEX * 0.5}" width="${HEX * 1.1}" height="5" rx="1"></rect><rect x="${cx - HEX * 0.55}" y="${cy + HEX * 0.5}" width="${HEX * 1.1 * Math.max(0, c.hp) / c.max}" height="5" rx="1" fill="${c.team === 'A' ? '#4aa8ff' : '#ff5566'}"></rect></g>`);
    if (isAlone(c)) g.appendChild(sv(`<circle class="alone-ring" cx="${cx}" cy="${cy}" r="${HEX * 0.72}"></circle>`));
    if (G.phase === 'program' && !G.humans.includes(c.team) && G.humans.length) { /* enemy orders hidden */ }
    g.addEventListener('click', () => boardClick(c.pos));
    svg.appendChild(g); }
  if (UI.revealing && G.marks) { const stack = {}; for (const mk of G.marks) { if (mk.kind === 'arrow') { const [x1, y1] = px(...mk.from), [x2, y2] = px(...mk.to); svg.appendChild(sv(`<line class="arrow" x1="${x1}" y1="${y1}" x2="${x2 - (x2 - x1) * 0.4}" y2="${y2 - (y2 - y1) * 0.4}"></line>`)); } if (mk.kind === 'num') { const k = key(...mk.hex); const n = stack[k] = (stack[k] || 0) + 1; const [cx, cy] = px(...mk.hex); svg.appendChild(sv(`<text class="num ${mk.cls}" x="${cx}" y="${cy - HEX * 0.75 - (n - 1) * 14}">${esc(mk.text)}</text>`)); } }
    if (G.tierLabel) svg.appendChild(sv(`<text class="tier" x="${Math.min(...xs) + 10}" y="${Math.min(...ys) - 10}">TIER ${G.tierLabel}</text>`)); }
}
function hexPts(cx, cy) { const p = []; for (let k = 0; k < 6; k++) { const a = Math.PI / 180 * (60 * k - 30); p.push(`${(cx + HEX * 0.96 * Math.cos(a)).toFixed(1)},${(cy + HEX * 0.96 * Math.sin(a)).toFixed(1)}`); } return p.join(' '); }
function renderPrompt() {
  const b = document.getElementById('buttons'); b.innerHTML = '';
  const p = document.getElementById('prompt');
  if (G.phase === 'draft') { p.textContent = `Draft — ${G.draftOrder[G.draftIdx]} picks (snake A B B A A B B A A B).`; return; }
  if (G.phase === 'opening') {
    const mineTurn = G.humans.includes(G.openingTurn);
    p.textContent = mineTurn ? (G.openingFallback ? 'Opening — none of your remaining openings can be played (a move is blocked). Click a champion that hasn\'t played, then a hex beside it, or itself to stay.' : 'Opening — your play: click one opening on a champion that hasn\'t played (hover to preview its moves). A greyed opening has a blocked move. Exactly one opening per champion casts; casts aim themselves and can\'t kill. Red numbers: enemy champions that could reach that hex next round.') : `Opening — team ${G.openingTurn} is playing…`;
    return;
  }
  if (G.phase === 'program') {
    if (!G.humans.length) { p.textContent = 'Both AIs are programming…'; return; }
    const sel = UI.sel != null ? G.champs[UI.sel] : null, m = UI.mode;
    if (m && sel) { const ab = m.ab != null ? sel.def.abilities[m.ab] : null;
      p.textContent = m.kind === 'move' ? `${sel.def.name}: click a green hex to move there (up to ${RULES.spd}).` : m.kind === 'focus' ? 'Click the enemy your team focuses (auto-aim prefers it).' : ab.kind === 'track' ? `${ab.name}: click a ${ab.ally ? 'ally' : 'target'} within ${ab.range} of where ${sel.def.name} will stand. It follows the target.` : ab.kind === 'hex' ? `${ab.name}: click a hex within ${ab.range}. It hits whoever is there at tier ${ab.init}.` : `${ab.name}: click a neighbouring hex to set the facing.`; }
    else p.textContent = `Round ${G.round}: energy ${energyLeft('A')} of ${G.orders.A.energy} left. Select a champion, then Move (1) or an ability (costs its initiative, two per champion in descending initiative). Lock in when done.`;
    const lock = h(`<button class="primary">Lock in</button>`); lock.addEventListener('click', lockIn); b.appendChild(lock);
    if (m) { const cancel = h('<button>Cancel</button>'); cancel.addEventListener('click', () => { UI.mode = null; render(); }); b.appendChild(cancel); }
    return;
  }
  if (G.phase === 'reveal') { p.textContent = G.tierLabel ? `Tier ${G.tierLabel}: both teams resolve at once — control, then damage, then deaths.` : 'Reveal: orders shown, moves resolve together.'; const s = h('<button>Skip to the end</button>'); s.addEventListener('click', skipReveal); b.appendChild(s); return; }
  if (G.phase === 'over') { p.textContent = G.winner === 'draw' ? 'A draw.' : `Team ${G.winner} wins.`; }
}
function renderLog() { const el = document.getElementById('log'); el.innerHTML = ''; const start = Math.max(0, G.log.length - 80); G.log.slice(start).forEach((l, i, arr) => el.appendChild(h(`<div class="b ${l.cls} ${i === arr.length - 1 ? 'now' : ''}">${esc(l.text)}</div>`))); el.scrollTop = el.scrollHeight; }
function renderStats() { const s = STATS; document.getElementById('stats').innerHTML = `<span>matches <b>${s.matches}</b> (A <b>${s.matches ? Math.round(100 * s.winsA / s.matches) : 0}%</b>)</span><span>deaths <b>${s.deaths}</b></span><span>burst kills <b>${s.deaths ? Math.round(100 * s.bursts / s.deaths) : 0}%</b></span><span>lost orders <b>${s.lost}</b></span><span>fizzled <b>${s.fizz}</b></span><span>lead changes <b>${s.leadChanges}</b></span><span>your decisions <b>${s.decisions}</b></span>`; }
function renderOverlay() {
  const ov = document.getElementById('overlay');
  if (UI.help) { ov.className = 'overlay'; ov.innerHTML = `<div class="box help"><button id="help-close" style="float:right">Close</button><h2>Programmed rounds — the prototype rules</h2>
    <h3>The opening</h3>The main game's opening, in the open. Each ability owns an <b>opening</b>: three instructions in your team's frame — "mid ↗" moves whoever plays mid one hex forward-right; "cast" fires the ability that owns the opening, aimed by itself (nearest enemy, lowest HP first; patterns face where they hit most; allies: the most wounded). Teams alternate; a play is one champion that hasn't played yet and one of its three openings; every champion plays exactly one; A plays first. Moves are <b>strict</b>: an opening with a blocked move (edge, tower, any champion) can't be played, and you must play an opening if any fits — only when none fits do your remaining champions step one hex each. Exactly one opening per champion casts; an opening cast can't kill (1 HP floor) and may fizzle. The secret rounds begin when both teams are done, so the first programs are written with the enemy already in reach. Red numbers on hexes count the enemy champions that could reach that hex next round (their move plus their range); 3 or more turns the hex dark red.
    <h3>Each round</h3>Both teams secretly write orders, then everything reveals and resolves. Energy per round: ${[1,2,3,4,5,6,7,8].map(energyFor).join(' · ')}. A <b>move</b> costs 1 (up to ${RULES.spd} hexes). An <b>ability</b> costs its initiative. A champion may hold one move and up to two abilities in strictly descending initiative (a 3 then a 1: give, then cash in). Each team also names a <b>Focus</b> enemy that auto-aim prefers.
    <h3>Commitment by tier</h3>Tier 4 abilities are fixed patterns, forward. Tier 3 commit a facing. Tier 2 commit a hex. Tier 1 commit a champion and follow it. Moving out of a pattern is dodging.
    <h3>Resolution</h3>Moves first, all at once (a contested hex goes to the priority token holder; the token alternates). Then tiers 4 → 3 → 2 → 1: within a tier both teams act at once — control (root, exhaust) first, then damage, then deaths. The dead finish their tier. <b>Exhaust cancels the target's remaining orders.</b> An order whose caster died earlier is <b>lost</b> (energy refunded next round, up to ${RULES.carryCap}); one with nothing to hit <b>fizzles</b>.
    <h3>Damage</h3>Each champion <b>wants</b> a status: it hits enemies carrying it ×${RULES.want} (at least +${RULES.wantFloor}). A champion with no ally beside it is <b>alone</b> and takes ×${RULES.alone}. Statuses last through the next round. Rooted can't move. Burning takes ${RULES.burn} at round close.
    <h3>Score</h3>Nexus ${RULES.nexus}. A death costs its nexus ${RULES.killTax}. At round close: champions beside the enemy nexus hit it for ${RULES.gateHit}; the team with more champions beside the centre tower deals 1. The dead return after ${RULES.respawn} rounds. After round ${RULES.rounds} the higher nexus wins.
    <h3>What to watch</h3>Burst kills (a champion killed from 60%+ HP in one round), lost orders (the undercut problem), and whether the reveal produces the swing. The bottom strip counts them.</div>`;
    document.getElementById('help-close').onclick = () => { UI.help = false; render(); }; return; }
  if (G.phase !== 'draft') { ov.className = 'overlay hidden'; ov.innerHTML = ''; return; }
  ov.className = 'overlay';
  const team = G.draftOrder[G.draftIdx], human = G.humans.includes(team);
  const box = h(`<div class="box"><div class="modes" style="float:right"><button data-m="play">Play A vs AI</button><button data-m="watch">Watch AI vs AI</button><button data-m="board">Board: ${BOARDS[UI.board].name} ⇄</button><button data-m="help">Rules</button></div><h2>Draft — ${human ? 'your pick' : 'AI picks'} (team ${team})</h2><p style="color:var(--dim)">Snake order A B B A A B B A A B. One champion per role; a champion taken is gone for both. Pairs: a champion that <b>gives</b> a status feeds a teammate that <b>wants</b> it.</p><div class="dcols"></div></div>`);
  const cols = box.querySelector('.dcols');
  for (const role of ROLES) { const col = h(`<div><h3>${role}</h3></div>`);
    for (const d of ROSTER.filter(x => x.role === role)) { const taken = G.taken.has(d.id), pickable = human && !taken && !G.picks[team][ROLES.indexOf(role)];
      const card = h(`<div class="dcard ${pickable ? 'pickable' : ''} ${taken ? 'taken' : ''}"><b class="n">${esc(d.name)}</b><span style="color:var(--dim)">HP ${d.hp}${d.gives ? ' · gives ' + d.gives : ''}${d.wants ? ' · wants ' + d.wants : ''}</span>${d.abilities.map((a, i) => `<div class="ab"><span class="k"><span>${'QWE'[i]} ${esc(a.name)}</span><i class="t${a.init}">${a.init}</i></span><small>${abText(a)}</small></div>`).join('')}</div>`);
      if (pickable) card.addEventListener('click', () => draftPick(d)); col.appendChild(card); }
    cols.appendChild(col); }
  box.querySelectorAll('button[data-m]').forEach(b => b.addEventListener('click', () => { const m = b.dataset.m; if (m === 'help') { UI.help = true; render(); } else if (m === 'board') { UI.board = UI.board === 'small' ? 'field7' : 'small'; newMatch(!G.humans.length); } else newMatch(m === 'watch'); }));
  ov.innerHTML = ''; ov.appendChild(box);
}

// ───────────── wiring ─────────────
document.getElementById('btn-new').addEventListener('click', () => newMatch(false));
document.getElementById('btn-watch').addEventListener('click', () => newMatch(true));
document.getElementById('btn-threat').addEventListener('click', () => { UI.threat = !UI.threat; render(); });
document.getElementById('btn-board').addEventListener('click', () => { UI.board = UI.board === 'small' ? 'field7' : 'small'; newMatch(!G.humans.length); });
document.getElementById('btn-help').addEventListener('click', () => { UI.help = true; render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (UI.help) { UI.help = false; render(); } else if (UI.mode) { UI.mode = null; render(); } } });
newMatch(false);
</script>
